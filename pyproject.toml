[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "omaha-lab"
version = "0.1.0"
description = "Hands-on lab guide for local LLM security, agentic tool-calling, and OWASP mitigation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.28",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-ollama>=0.2.1",
    "chromadb>=0.5.20",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "ollama>=0.3.3",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "requests>=2.32.3",
    "ddgs>=6.3.7",
    "PyYAML>=6.0.2",
]

[project.urls]
Homepage = "https://github.com/omaha-lab/omaha-lab"
Issues = "https://github.com/omaha-lab/omaha-lab/issues"
