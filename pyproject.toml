[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "omaha-lab"
version = "0.1.0"
description = "Hands-on lab guide for local LLM security, agentic tool-calling, and OWASP mitigation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.28",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-ollama>=0.2.1",
    "chromadb>=0.5.20",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "ollama>=0.3.3",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "requests>=2.32.3",
    "ddgs>=6.3.7",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
# pip install ".[nlp]"      — required by Presidio (spacy NER model pulled separately)
nlp = [
    "spacy>=3.8",
]
# pip install ".[ui]"       — Chainlit browser interface (chainlit run ui.py)
ui = [
    "chainlit>=2.0",
]
# pip install ".[observe]"  — Arize Phoenix local trace viewer (--observe on)
observe = [
    "arize-phoenix>=15.0",
    "arize-phoenix-otel>=0.16",
    "openinference-instrumentation>=0.1",
    "openinference-instrumentation-langchain>=0.1",
    "openinference-semantic-conventions>=0.1",
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.39",
]
# pip install ".[all]"      — everything above
all = [
    "omaha-lab[nlp,ui,observe]",
]

[project.urls]
Homepage = "https://github.com/omaha-lab/omaha-lab"
Issues = "https://github.com/omaha-lab/omaha-lab/issues"
